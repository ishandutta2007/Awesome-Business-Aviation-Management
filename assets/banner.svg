<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="plane-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
    .flight-path { stroke: url(#accent-gradient); stroke-width: 3; fill: none; stroke-dasharray: 8 4; animation: dash 30s linear infinite; }
    .radar-sweep { transform-origin: 1000px 160px; animation: rotate 12s linear infinite; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" fill="url(#bg-gradient)" rx="16"/>

  <!-- Radar Graphic Background (Dynamic/Animated aspect in right background) -->
  <g transform="translate(1000, 160)" opacity="0.25">
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="80" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#475569" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#475569" stroke-width="1"/>
    <path class="radar-sweep" d="M 0 0 L 120 0 A 120 120 0 0 0 0 -120 Z" fill="url(#plane-glow)"/>
  </g>

  <!-- Flight Trail Path in Background -->
  <path d="M 50 260 Q 300 280 500 180 T 950 80" class="flight-path" />

  <!-- Animated Plane SVG Icon traveling along top right -->
  <g transform="translate(940, 68) rotate(-15)" filter="url(#glow)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" fill="#38bdf8"/>
  </g>

  <!-- Decorative Grid Lines -->
  <line x1="80" y1="40" x2="80" y2="280" class="grid-line" />
  <line x1="400" y1="40" x2="400" y2="280" class="grid-line" />

  <!-- Main Content Foreground (Guaranteed clear visibility) -->
  <g transform="translate(100, 0)">
    <!-- Pill Category Badge -->
    <rect x="0" y="55" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="76" text-anchor="middle" class="badge-text">✈️ BUSINESS AVIATION TECH</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title">Awesome Business Aviation Management</text>

    <!-- Gradient Divider Line -->
    <rect x="0" y="168" width="680" height="4" rx="2" fill="url(#accent-gradient)"/>

    <!-- Subtitle -->
    <text x="0" y="210" class="subtitle">Curated SaaS Platforms, Flight Operations Software &amp; Open-Source Tools</text>
    <text x="0" y="240" class="subtitle" font-size="16px" fill="#64748b">Flight Operations • Maintenance Tracking • Crew Scheduling • EFB &amp; FMS</text>
  </g>
</svg>
